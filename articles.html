<!-- ✅ Ce lien doit être ici, en dehors de <style> -->
<link href="styles.css?v=2" rel="stylesheet"/>
<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
    }
    header {
       background-color: #000 !important;
       background-image: none !important;
       padding: 20px;
       text-align: center;
    }
    header img {
      height: 50px;
      vertical-align: middle;
    }
    nav ul {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    nav ul li {
      display: inline;
      margin: 0 15px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 2em;
    }
    .intro {
      text-align: center;
      margin-bottom: 40px;
      color: #ccc;
      font-style: italic;
    }
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 0 20px 40px;
    }
    .gallery a img {
      width: 100%;
      max-width: 700px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }
    .gallery a img:hover {
      transform: scale(1.03);
    }
    /* Mode clair : corriger l'en-tête et les liens */
body.light-mode header {
  background-color: #fff !important;
  background-image: none !important;
  color: black;
}

/* Mode clair : liens dans le menu */
body.light-mode header nav ul li a {
  color: black !important;
}

/* Mode clair : logo inversé */
body.light-mode .logo {
  filter: invert(100%);
}
  
    #dark-mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: 1px solid white;
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    body.light-mode #dark-mode-toggle {
      border: 1px solid black;
      color: black;
    }

    header {
      position: relative;
    }

    body.light-mode .intro {
      color: #333;
    }

    body.light-mode {
      background-color: #f2f2f2;
      color: #111;
    }

    body.light-mode h1 {
      color: #111;
    }

    body.light-mode .intro {
      color: #333 !important;
    }

    main {
      padding: 40px;
      text-align: center;
    }
    
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const savedMode = localStorage.getItem("theme");
    const body = document.body;
    const toggleBtn = document.getElementById("dark-mode-toggle");

    if (savedMode === "light") {
      body.classList.add("light-mode");
      toggleBtn.textContent = "🌙";
    } else {
      body.classList.remove("light-mode");
      toggleBtn.textContent = "☀️";
    }
  });

  function toggleDarkMode() {
    const body = document.body;
    const toggleBtn = document.getElementById("dark-mode-toggle");

    body.classList.toggle("light-mode");

    if (body.classList.contains("light-mode")) {
      toggleBtn.textContent = "🌙";
      localStorage.setItem("theme", "light");
    } else {
      toggleBtn.textContent = "☀️";
      localStorage.setItem("theme", "dark");
    }
  }
</script>
</head>
<body>
<header>
<button id="dark-mode-toggle" onclick="toggleDarkMode()">☀️</button>
<a href="index.html"><img alt="Logo Sone Events" class="logo" src="logo.png"/>

</ul>
</nav>
